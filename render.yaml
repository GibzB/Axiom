services:
  - type: web
    name: axiom-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_DEFAULT_REGION
        value: eu-west-1
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BEDROCK_GENERATION_MODEL_ID
        value: global.amazon.nova-2-lite-v1:0
      - key: BEDROCK_EMBEDDING_MODEL_ID
        value: amazon.titan-embed-text-v2:0
      - key: BEDROCK_EMBEDDING_DIMENSIONS
        value: "1024"
